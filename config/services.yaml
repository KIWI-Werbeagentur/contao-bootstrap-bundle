services:
  _defaults:
    autowire: true
    autoconfigure: true

  Kiwi\Contao\BootstrapBundle\Service\BootstrapFrontendService: '@kiwi.contao.responsive.frontend'
  Kiwi\Contao\BootstrapBundle\EventListener\LoadDataContainerListener: ~
  Kiwi\Contao\BootstrapBundle\EventListener\GeneratePageListener: ~
  Kiwi\Contao\BootstrapBundle\EventListener\AlterResponsiveValues: ~
  Kiwi\Contao\BootstrapBundle\Twig\BootstrapResponsiveTwigExtension:
    tags: ['twig.extension']
  Kiwi\Contao\BootstrapBundle\CacheWarmer\TwbsAssetSymlinkWarmer:
    arguments:
      - '@filesystem'
      - '%kernel.project_dir%'
  Kiwi\Contao\BootstrapBundle\Service\SpacingsFileRegenerator:
    public: true
    arguments:
      - '@filesystem'
      - '@twig'
      - '%kernel.project_dir%'
      - '%kiwi_bootstrap.grid%'
  Kiwi\Contao\BootstrapBundle\CacheWarmer\SpacingsCacheWarmer: ~
  Kiwi\Contao\BootstrapBundle\Service\GridStylesRegenerator:
    public: true
    arguments:
      - '@filesystem'
      - '@twig'
      - '%kernel.project_dir%'
      - '%kiwi_bootstrap.grid%'
  Kiwi\Contao\BootstrapBundle\CacheWarmer\GridStylesCacheWarmer: ~
  Kiwi\Contao\BootstrapBundle\Service\LayoutImportsFileRegenerator:
    public: true
    arguments:
      - '@filesystem'
      - '@twig'
      - '%kernel.project_dir%'
  Kiwi\Contao\BootstrapBundle\CacheWarmer\LayoutImportsCacheWarmer: ~
  Kiwi\Contao\BootstrapBundle\Migration\PreserveLegacySpacingsMode:
    arguments:
      $connection: '@database_connection'
      $filesystem: '@filesystem'
      $projectDir: '%kernel.project_dir%'
      $spacingsWarmer: '@Kiwi\Contao\BootstrapBundle\CacheWarmer\SpacingsCacheWarmer'
      $cacheDir: '%kernel.cache_dir%'
  Kiwi\Contao\BootstrapBundle\Migration\PreserveLegacyGridMode:
    arguments:
      $connection: '@database_connection'
      $filesystem: '@filesystem'
      $projectDir: '%kernel.project_dir%'
      $gridStylesWarmer: '@Kiwi\Contao\BootstrapBundle\CacheWarmer\GridStylesCacheWarmer'
      $layoutImportsWarmer: '@Kiwi\Contao\BootstrapBundle\CacheWarmer\LayoutImportsCacheWarmer'
      $cacheDir: '%kernel.cache_dir%'
  Kiwi\Contao\BootstrapBundle\Migration\BackfillContainerPaddingX:
    arguments:
      - '@database_connection'
